[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cas13guide"
version = "0.1.0"
description = "Cas13 target-RNA guide locator and scoring pipeline built on calibrated evidence"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
# ViennaRNA (DR2) powers structural accessibility (FR3.x) and duplex free
# energy (FR5.x). Optional rather than required: the pipeline runs without it
# via NullAccessibilityModel / NullDuplexEnergyModel, which report "no
# evidence" rather than guessing, and the tests that need it skip themselves.
structure = ["ViennaRNA>=2.6"]
dev = ["pytest>=7.4", "hypothesis>=6.90", "ViennaRNA>=2.6"]

[project.scripts]
cas13guide = "cas13guide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ships the PEP 561 marker so downstream type checkers actually read the
# annotations this package is fully written with.
[tool.setuptools.package-data]
cas13guide = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
