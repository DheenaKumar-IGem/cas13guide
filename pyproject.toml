[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cas13guide"
version = "0.1.0"
description = "Cas13 target-RNA guide locator and scoring pipeline built on calibrated evidence"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
# ViennaRNA (DR2) powers structural accessibility (FR3.x) and duplex free
# energy (FR5.x). Optional rather than required: the pipeline runs without it
# via NullAccessibilityModel / NullDuplexEnergyModel, which report "no
# evidence" rather than guessing, and the tests that need it skip themselves.
structure = ["ViennaRNA>=2.6"]
# The Arc RNAtargeting CNN (services/arc_model.py). The weights ship in the
# package; onnxruntime does not. Note it still needs a LinearFold CONTRAfold
# energy source, which this package deliberately does not supply -- see
# THIRD_PARTY_LICENSES.md and the module docstring.
arc = ["onnxruntime>=1.17"]
# LinearFold-CONTRAfold folding scores for the Arc model (services/contrafold.py).
# A pure-Python CONTRAfold CRF, so it needs no compiler -- which is the only
# reason the Arc model is usable on a machine without a C++ toolchain.
contrafold = ["gpu-contrafold>=0.1"]
dev = ["pytest>=7.4", "hypothesis>=6.90", "mypy>=1.8", "ViennaRNA>=2.6",
       "onnxruntime>=1.17", "gpu-contrafold>=0.1"]

[project.scripts]
cas13guide = "cas13guide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ships the PEP 561 marker so downstream type checkers actually read the
# annotations this package is fully written with.
[tool.setuptools.package-data]
cas13guide = ["py.typed", "models/arc/*.onnx"]

# The package promises clean annotations by shipping py.typed, so `mypy` has
# to be runnable without a remembered flag. Plain `mypy src/cas13guide`
# reported six errors, all of them the same thing: ViennaRNA, gpu-contrafold
# and onnxruntime are C extensions that ship no stubs. Six standing errors
# train a reader to skim past mypy output, which is how a real one gets missed.
#
# Named per-module rather than with a blanket --ignore-missing-imports: that
# flag would also silence a mistyped *first-party* import, which is exactly the
# error worth keeping. These three are optional dependencies, each already
# behind a try/except ImportError with a documented fallback.
[tool.mypy]
files = ["src/cas13guide"]

[[tool.mypy.overrides]]
module = ["RNA", "gpu_contrafold.*", "onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
